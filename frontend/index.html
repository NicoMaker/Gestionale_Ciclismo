<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giro — Gestionale Tappe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base/variabili.css" />
    <link rel="stylesheet" href="css/base/layout.css" />
    <link rel="stylesheet" href="css/componenti/icone.css" />
    <link rel="stylesheet" href="css/componenti/dashboard.css" />
    <link rel="stylesheet" href="css/componenti/ricerca.css" />
    <link rel="stylesheet" href="css/componenti/tabella.css" />
    <link rel="stylesheet" href="css/componenti/squadre-cards.css" />
    <link rel="stylesheet" href="css/componenti/sotto-schede.css" />
    <link rel="stylesheet" href="css/componenti/autocomplete-nazioni.css" />
    <link rel="stylesheet" href="css/componenti/modal.css" />
    <link rel="stylesheet" href="css/componenti/rosa-squadra.css" />
    <link rel="stylesheet" href="css/componenti/dettaglio-corridore.css" />
    <link rel="stylesheet" href="css/componenti/toast.css" />
    <link rel="stylesheet" href="css/rifiniture.css" />
  </head>
  <body>
    <div class="frame">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-icon">🚴</span>
          <div class="brand-testo">
            <span class="brand-mark">GIRO</span>
            <span class="brand-sub">gestionale tappe</span>
          </div>
        </div>

        <nav class="nav">
          <span class="nav-title">Sezioni principali</span>
          <button class="nav-item active" data-view="dashboard">
            <svg viewBox="0 0 24 24" class="nav-icon">
              <rect x="3" y="3" width="7" height="9" rx="1.5" />
              <rect x="14" y="3" width="7" height="5" rx="1.5" />
              <rect x="14" y="12" width="7" height="9" rx="1.5" />
              <rect x="3" y="16" width="7" height="5" rx="1.5" />
            </svg>
            <span>Dashboard</span>
          </button>
          <button class="nav-item" data-view="tappe">
            <svg viewBox="0 0 24 24" class="nav-icon">
              <path
                d="M4 20 L10 4 L14 4 L20 20"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path d="M8 14 L16 14" stroke-linecap="round" />
            </svg>
            <span>Tappe</span>
          </button>
          <button class="nav-item" data-view="corridori">
            <svg viewBox="0 0 24 24" class="nav-icon">
              <circle cx="6" cy="17" r="3" />
              <circle cx="18" cy="17" r="3" />
              <path
                d="M6 17 L10 9 L14 9 L18 17 M10 9 L8 5 L11 5 M10 9 L14 13"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>Corridori</span>
          </button>
          <button class="nav-item" data-view="squadre">
            <svg viewBox="0 0 24 24" class="nav-icon">
              <circle cx="9" cy="8" r="3" />
              <circle cx="16" cy="9" r="2.5" />
              <path
                d="M3 20 C3 15.5 5.5 14 9 14 C12.5 14 15 15.5 15 20 M14.5 14.5 C17.5 14.7 20 16 20 19.5"
                stroke-linecap="round"
              />
            </svg>
            <span>Squadre</span>
          </button>
          <button class="nav-item" data-view="risultati">
            <svg viewBox="0 0 24 24" class="nav-icon">
              <path d="M6 3 V21" stroke-linecap="round" />
              <path d="M6 4 L18 4 L14 8 L18 12 L6 12" stroke-linejoin="round" />
            </svg>
            <span>Risultati</span>
          </button>
          <button class="nav-item" data-view="classifiche">
            <svg viewBox="0 0 24 24" class="nav-icon">
              <path d="M5 20 V13 M12 20 V6 M19 20 V10" stroke-linecap="round" />
            </svg>
            <span>Classifiche</span>
          </button>
          <span class="nav-title">Altre funzionalità</span>
          <button class="nav-item" data-view="regolamento">
            <svg viewBox="0 0 24 24" class="nav-icon">
              <path
                d="M12 3 L19 6 V11 C19 16 16 19.5 12 21 C8 19.5 5 16 5 11 V6 Z"
                stroke-linejoin="round"
              />
              <path
                d="M9 12 L11 14 L15.5 9.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>Regolamento</span>
          </button>
          <button class="nav-item" data-view="stampa">
            <svg viewBox="0 0 24 24" class="nav-icon">
              <rect x="4" y="5" width="16" height="15" rx="1.5" />
              <path d="M7 9 H13 M7 12.5 H17 M7 16 H17" stroke-linecap="round" />
            </svg>
            <span>Stampa</span>
          </button>
          <button class="nav-item" data-view="nazioni">
            <svg viewBox="0 0 24 24" class="nav-icon">
              <circle cx="12" cy="12" r="8.5" />
              <path
                d="M3.5 12 H20.5 M12 3.5 C15 7 15 17 12 20.5 C9 17 9 7 12 3.5"
                stroke-linecap="round"
              />
            </svg>
            <span>Nazioni</span>
          </button>
          <button class="nav-item" data-view="cestino">
            <svg viewBox="0 0 24 24" class="nav-icon">
              <path
                d="M5 7 H19 M9 7 V4.6 C9 4 9.4 3.5 10 3.5 H14 C14.6 3.5 15 4 15 4.6 V7 M7.5 7 L8.3 19.4 C8.35 20.2 9 20.8 9.8 20.8 H14.2 C15 20.8 15.65 20.2 15.7 19.4 L16.5 7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path d="M10.3 10.5 V17 M13.7 10.5 V17" stroke-linecap="round" />
            </svg>
            <span>Cestino</span>
          </button>
        </nav>

        <div class="live-box">
          <div class="live-dot" id="liveDot"></div>
          <div class="live-text">
            <span id="liveLabel">nessuna diretta</span>
            <span id="liveSpettatori">0 connessi</span>
          </div>
        </div>
      </aside>

      <main class="content">
        <header class="topbar" id="topbar">
          <span class="topbar-icon" id="topbarIcon"></span>
          <h1 id="topbarTitle">Dashboard</h1>
        </header>

        <section class="view active" id="view-dashboard"></section>
        <section class="view" id="view-tappe"></section>
        <section class="view" id="view-corridori"></section>
        <section class="view" id="view-squadre"></section>
        <section class="view" id="view-risultati"></section>
        <section class="view" id="view-classifiche"></section>
        <section class="view" id="view-regolamento"></section>
        <section class="view" id="view-stampa"></section>
        <section class="view" id="view-nazioni"></section>
        <section class="view" id="view-cestino"></section>
      </main>
    </div>

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal" id="modalBox"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="js/core/main.js"></script>
  </body>
</html>
