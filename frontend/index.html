<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giro — Gestionale Tappe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="frame">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">GIRO</span>
      <span class="brand-sub">gestionale tappe · 20 tabelle</span>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="tappe">Tappe</button>
      <button class="nav-item" data-view="corridori">Corridori</button>
      <button class="nav-item" data-view="squadre">Squadre</button>
      <button class="nav-item" data-view="risultati">Risultati</button>
      <button class="nav-item" data-view="classifica">Classifica generale</button>
      <button class="nav-item" data-view="extra">Tabelle extra</button>
    </nav>

    <div class="live-box">
      <div class="live-dot" id="liveDot"></div>
      <div class="live-text">
        <span id="liveLabel">nessuna diretta</span>
        <span id="liveSpettatori">0 connessi</span>
      </div>
    </div>
  </aside>

  <main class="content">

    <!-- TAPPE -->
    <section class="view active" id="view-tappe">
      <header class="view-head">
        <h1>Tappe</h1>
        <button class="btn-primary" id="btnNuovaTappa">+ nuova tappa</button>
      </header>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>#</th><th>Nome</th><th>Percorso</th><th>Km</th><th>Dislivello</th><th>Tipo</th><th>Data</th><th>Stato</th><th></th></tr>
          </thead>
          <tbody id="tabellaTappe"></tbody>
        </table>
      </div>
    </section>

    <!-- CORRIDORI -->
    <section class="view" id="view-corridori">
      <header class="view-head">
        <h1>Corridori</h1>
        <button class="btn-primary" id="btnNuovoCorridore">+ nuovo corridore</button>
      </header>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Pett.</th><th>Nome</th><th>Nazionalità</th><th>Squadra</th><th></th></tr>
          </thead>
          <tbody id="tabellaCorridori"></tbody>
        </table>
      </div>
    </section>

    <!-- SQUADRE -->
    <section class="view" id="view-squadre">
      <header class="view-head">
        <h1>Squadre</h1>
        <button class="btn-primary" id="btnNuovaSquadra">+ nuova squadra</button>
      </header>
      <div class="cards-wrap" id="cardsSquadre"></div>
    </section>

    <!-- RISULTATI -->
    <section class="view" id="view-risultati">
      <header class="view-head">
        <h1>Risultati per tappa</h1>
        <select id="selectTappaRisultati" class="select-tappa"></select>
      </header>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Pos.</th><th>Pett.</th><th>Corridore</th><th>Squadra</th><th>Tempo</th><th>Distacco</th><th>Punti</th><th></th></tr>
          </thead>
          <tbody id="tabellaRisultati"></tbody>
        </table>
      </div>
      <button class="btn-secondary" id="btnAggiungiRisultato">+ aggiungi risultato</button>
    </section>

    <!-- CLASSIFICA -->
    <section class="view" id="view-classifica">
      <header class="view-head">
        <h1>Classifica generale</h1>
      </header>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Pos.</th><th>Corridore</th><th>Squadra</th><th>Tappe</th><th>Punti totali</th></tr>
          </thead>
          <tbody id="tabellaClassifica"></tbody>
        </table>
      </div>
    </section>

    <!-- TABELLE EXTRA (15 tabelle secondarie, gestione generica) -->
    <section class="view" id="view-extra">
      <header class="view-head">
        <h1>Tabelle extra</h1>
        <button class="btn-primary" id="btnNuovaRigaExtra">+ nuova riga</button>
      </header>
      <div class="extra-chooser" id="extraChooser"></div>
      <div class="table-wrap">
        <table>
          <thead><tr id="extraHead"></tr></thead>
          <tbody id="tabellaExtra"></tbody>
        </table>
      </div>
    </section>

  </main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
